spring:
  application:
    name: walletExercicedemo

  datasource:
    url: jdbc:sqlserver://localhost:1433;database=UserServiceDB;encrypt=false;user=sa;password=P@ssw0rd
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate.dialect: org.hibernate.dialect.SQLServerDialect
      hibernate.transaction.jta.platform: org.hibernate.engine.transaction.jta.platform.internal.NoJtaPlatform
    open-in-view: true
    database-platform: org.hibernate.dialect.SQLServerDialect
    show-sql: true

logging:
  level:
    root: INFO  # Set root logger to INFO level
    org:
      spring:
        hibernate:
          SQL: trace
          orm:
            jdbc:
              bind: trace # Logs the parameter binding of SQL statements
    # Set the specific levels for debugging in the web and hibernate
    org.springframework: DEBUG
    org.hibernate: DEBUG
    web: DEBUG

server:
  port: 8080

transaction:
  service:
    url: http://localhost:8081/transactions

# Add maxBalanceLimit here
app:
  maxBalanceLimit: 300
  threshold: 50

# Swagger configuration
springdoc:
  api-docs:
    path: /v3/api-docs # Ensures correct API docs URL
  swagger-ui:
    path: /swagger-ui.html
    enabled: true  # Ensure the Swagger UI is enabled, it might be missing in your case
